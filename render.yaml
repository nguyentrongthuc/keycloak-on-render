services:
  - type: web
    name: keycloak
    env: docker
    plan: free
    envVars:
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        value: jdbc:postgresql://${POSTGRES_HOST}/${POSTGRES_DB}
      - key: KC_DB_USERNAME
        value: ${POSTGRES_USER}
      - key: KC_DB_PASSWORD
        value: ${POSTGRES_PASSWORD}
      - key: KC_PROXY
        value: edge
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_HOSTNAME_STRICT_BACKCHANNEL
        value: "false"
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx384m"
      - key: KEYCLOAK_ADMIN
        value: admin
      - key: KEYCLOAK_ADMIN_PASSWORD
        value: admin123
    autoDeploy: true
    buildCommand: ""
    startCommand: ""
databases:
  - name: keycloak-db
    plan: free
